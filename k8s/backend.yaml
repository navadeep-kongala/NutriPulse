apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nutripulse-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutripulse-backend
spec:
  # 1 replica + Recreate: data is stored in JSON files on a single volume
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nutripulse-backend
  template:
    metadata:
      labels:
        app: nutripulse-backend
    spec:
      containers:
        - name: backend
          image: DOCKERHUB_USER/nutripulse-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
          # Optional API keys (see k8s/secret.example.yaml). Pod starts without them.
          envFrom:
            - secretRef:
                name: nutripulse-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/runtime-data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nutripulse-data
---
apiVersion: v1
kind: Service
metadata:
  name: nutripulse-backend
spec:
  type: ClusterIP
  selector:
    app: nutripulse-backend
  ports:
    - port: 4000
      targetPort: 4000
