apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutripulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nutripulse-frontend
  template:
    metadata:
      labels:
        app: nutripulse-frontend
    spec:
      containers:
        - name: frontend
          image: DOCKERHUB_USER/nutripulse-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nutripulse-frontend
spec:
  type: NodePort
  selector:
    app: nutripulse-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
