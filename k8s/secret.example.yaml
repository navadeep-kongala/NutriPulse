# Optional. Copy to secret.yaml, fill in values, and apply manually:
#   kubectl apply -f k8s/secret.yaml
# Do NOT commit the filled-in file (secret.yaml is in .gitignore).
# Easier alternative:
#   kubectl create secret generic nutripulse-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=FOOD_DATA_API_KEY=your-usda-key
apiVersion: v1
kind: Secret
metadata:
  name: nutripulse-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  FOOD_DATA_API_KEY: ""
